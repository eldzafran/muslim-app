<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penunjuk Arah Kiblat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Arah Kiblat</h1>
    
    <div class="compass-container">
      <div class="compass" id="compass">
        <div class="north">N</div>
        <div class="qibla-arrow" id="qiblaArrow">▲</div>
      </div>
    </div>

    <button id="btnStart">Aktifkan Kompas & Lokasi</button>
    <p id="statusInfo">Klik tombol untuk mulai mencari kiblat.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
