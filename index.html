<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penunjuk Arah Kiblat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="symbol">🕌</div>
      <h1>Penunjuk Arah Kiblat</h1>
      <p class="subtitle">Aplikasi Kompas Kiblat Presisi</p>
    </header>

    <div class="compass-wrapper">
      <div class="compass" id="compass">
        <div class="cardinal north">U</div>
        <div class="cardinal east">T</div>
        <div class="cardinal south">S</div>
        <div class="cardinal west">B</div>
        <div class="qibla-arrow" id="qiblaArrow" title="Arah Kiblat">▲</div>
      </div>
    </div>

    <div class="action-section">
      <button id="btnStart" class="btn-primary">
        <span>📍 Aktifkan GPS & Kompas</span>
      </button>
      <div class="status-box">
        <p id="statusInfo">Tekan tombol di atas untuk memulai pencarian arah kiblat.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
