<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penunjuk Arah Kiblat Digital</title>
  
  <!-- FontAwesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS for Map View -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    :root {
      --bg-dark: #0A1912;
      --bg-card: #132A20;
      --accent-gold: #D4AF37;
      --accent-gold-light: #F3E5AB;
      --emerald: #1B4D3E;
      --emerald-light: #2C6B56;
      --text-light: #F5F7F8;
      --text-muted: #A0B2A6;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, var(--bg-dark) 0%, #050D09 100%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .app-card {
      background: var(--bg-card);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 24px;
      padding: 24px 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Islamic Pattern Accent Overlay */
    .app-card::before {
      content: "";
      position: absolute;
      top: -50px;
      right: -50px;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .header {
      margin-bottom: 20px;
    }

    .arabic-title {
      font-family: 'Amiri', serif;
      color: var(--accent-gold);
      font-size: 2rem;
      line-height: 1.2;
      margin-bottom: 4px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    /* Compass Styling */
    .compass-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .compass-outer-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px dashed rgba(212, 175, 55, 0.4);
      animation: spinRing 60s linear infinite;
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .compass-dial {
      position: relative;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: radial-gradient(circle, #1a3a2c 0%, #0d2118 100%);
      border: 6px solid var(--accent-gold);
      box-shadow: inset 0 0 15px rgba(0,0,0,0.7), 0 0 20px rgba(212, 175, 55, 0.2);
      transition: transform 0.1s cubic-bezier(0.1, 0.5, 0.1, 1);
      will-change: transform;
    }

    .cardinal-mark {
      position: absolute;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .mark-n { top: 8px; left: 50%; transform: translateX(-50%); color: #e74c3c; font-size: 1rem; }
    .mark-e { right: 10px; top: 50%; transform: translateY(-50%); }
    .mark-s { bottom: 8px; left: 50%; transform: translateX(-50%); }
    .mark-w { left: 10px; top: 50%; transform: translateY(-50%); }

    /* Kaaba Pointer Inside Dial */
    .qibla-pointer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transition: transform 0.1s cubic-bezier(0.1, 0.5, 0.1, 1);
      will-change: transform;
    }

    .kaaba-icon {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--accent-gold);
      font-size: 1.6rem;
      filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.8));
    }

    .pointer-line {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 65px;
      background: linear-gradient(to bottom, var(--accent-gold), transparent);
    }

    .compass-center {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent-gold);
      border: 3px solid var(--bg-card);
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
      z-index: 5;
    }

    /* Info Cards */
    .info-box {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 14px;
      margin: 15px 0;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .info-item {
      text-align: center;
    }

    .info-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent-gold-light);
      margin-top: 2px;
    }

    /* Buttons & Controls */
    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-gold) 0%, #B38F24 100%);
      color: #0A1912;
      border: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(212, 175, 55, 0.25);
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: var(--accent-gold);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      margin-top: 10px;
      cursor: pointer;
    }

    /* Status Text */
    #statusMessage {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 10px;
      min-height: 24px;
    }

    /* Map Drawer */
    #mapContainer {
      height: 200px;
      width: 100%;
      border-radius: 16px;
      margin-top: 15px;
      display: none;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .map-notice {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <div class="arabic-title">القبلة</div>
      <div class="subtitle">PENUNJUK ARAH KIBLAT</div>
    </div>

    <!-- Compass Visualization -->
    <div class="compass-wrapper">
      <div class="compass-outer-ring"></div>
      
      <!-- Rotating Dial (Follows North) -->
      <div class="compass-dial" id="compassDial">
        <span class="cardinal-mark mark-n">N</span>
        <span class="cardinal-mark mark-e">E</span>
        <span class="cardinal-mark mark-s">S</span>
        <span class="cardinal-mark mark-w">W</span>

        <!-- Qibla Arrow Pointer -->
        <div class="qibla-pointer" id="qiblaPointer">
          <i class="fa-solid fa-kaaba kaaba-icon"></i>
          <div class="pointer-line"></div>
        </div>
      </div>

      <div class="compass-center"></div>
    </div>

    <!-- Dynamic Metrics -->
    <div class="info-box">
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">Sudut Kiblat</div>
          <div class="info-value" id="qiblaDegree">--°</div>
        </div>
        <div class="info-item">
          <div class="info-label">Jarak ke Ka'bah</div>
          <div class="info-value" id="kaabaDistance">-- km</div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <button class="btn-main" id="startBtn">
      <i class="fa-solid fa-compass"></i> Aktifkan Lokasi & Kompas
    </button>
    
    <button class="btn-secondary" id="toggleMapBtn" style="display: none;">
      <i class="fa-solid fa-map-location-dot"></i> Lihat di Peta Peta (Alternatif)
    </button>

    <p id="statusMessage">Klik tombol di atas untuk memulai.</p>

    <!-- Fallback Map Container -->
    <div id="mapContainer"></div>
  </div>

  <!-- Leaflet JS for Map View -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Constants
    const KAABA_LAT = 21.422487;
    const KAABA_LNG = 39.826206;

    // Elements
    const compassDial = document.getElementById('compassDial');
    const qiblaPointer = document.getElementById('qiblaPointer');
    const qiblaDegreeEl = document.getElementById('qiblaDegree');
    const kaabaDistanceEl = document.getElementById('kaabaDistance');
    const statusMessage = document.getElementById('statusMessage');
    const startBtn = document.getElementById('startBtn');
    const toggleMapBtn = document.getElementById('toggleMapBtn');
    const mapContainer = document.getElementById('mapContainer');

    // State variables
    let qiblaBearing = 0;
    let userLat = null;
    let userLng = null;
    let map = null;
    let currentAlpha = 0;

    // Low-Pass Filter for smooth compass motion
    function lerp(start, end, factor) {
      let diff = end - start;
      while (diff < -180) diff += 360;
      while (diff > 180) diff -= 360;
      return start + diff * factor;
    }

    // Great Circle Formula (Mathematical Qibla Angle)
    function calculateQibla(lat, lng) {
      const phi1 = lat * Math.PI / 180;
      const phi2 = KAABA_LAT * Math.PI / 180;
      const deltaLambda = (KAABA_LNG - lng) * Math.PI / 180;

      const y = Math.sin(deltaLambda);
      const x = Math.cos(phi1) * Math.tan(phi2) - Math.sin(phi1) * Math.cos(deltaLambda);

      let bearing = Math.atan2(y, x) * 180 / Math.PI;
      return (bearing + 360) % 360;
    }

    // Haversine Formula (Distance Calculation)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth's radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c);
    }

    // Get User Location
    function fetchLocation() {
      if (!navigator.geolocation) {
        statusMessage.textContent = 'Browser Anda tidak mendukung lokasi GPS.';
        return;
      }

      statusMessage.textContent = 'Mengambil koordinat GPS...';

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;

          // Compute Kiblat Metrics
          qiblaBearing = calculateQibla(userLat, userLng);
          const distance = calculateDistance(userLat, userLng, KAABA_LAT, KAABA_LNG);

          // Update UI
          qiblaDegreeEl.textContent = `${qiblaBearing.toFixed(1)}°`;
          kaabaDistanceEl.textContent = `${distance.toLocaleString('id-ID')} km`;
          
          // Set static rotation of Kaaba pointer relative to dial North
          qiblaPointer.style.transform = `rotate(${qiblaBearing}deg)`;

          statusMessage.textContent = 'Lokasi ditemukan. Mengaktifkan kompas...';
          toggleMapBtn.style.display = 'inline-block';

          initCompass();
        },
        (err) => {
          statusMessage.textContent = 'Gagal mengambil lokasi. Izinkan akses GPS Anda.';
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // Initialize Device Orientation Sensor
    function initCompass() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iOS Permission Flow
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation, true);
              statusMessage.textContent = 'Putar HP hingga ikon Ka'bah tegak lurus ke atas.';
            } else {
              statusMessage.textContent = 'Akses sensor gerak ditolak.';
            }
          })
          .catch(console.error);
      } else {
        // Android / Standard Browsers
        if ('ondeviceorientationabsolute' in window) {
          window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        } else {
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
        statusMessage.textContent = 'Putar HP hingga ikon Ka\'bah tegak lurus ke atas. (Ayunkan HP berbentuk angka 8 jika kurang akurat)';
      }
    }

    // Process Compass Heading
    function handleOrientation(e) {
      let compassHeading = null;

      if (e.webkitCompassHeading) {
        // iOS Compass Heading
        compassHeading = e.webkitCompassHeading;
      } else if (e.alpha !== null) {
        // Android Absolute Alpha
        compassHeading = (360 - e.alpha) % 360;
      }

      if (compassHeading !== null) {
        // Apply smooth filtering
        currentAlpha = lerp(currentAlpha, compassHeading, 0.15);
        
        // Rotate main compass dial to face North
        compassDial.style.transform = `rotate(${-currentAlpha}deg)`;
      }
    }

    // Interactive Map Toggle (Visual Fallback)
    toggleMapBtn.addEventListener('click', () => {
      if (mapContainer.style.display === 'none' || mapContainer.style.display === '') {
        mapContainer.style.display = 'block';
        toggleMapBtn.innerHTML = '<i class="fa-solid fa-eye-slash"></i> Sembunyikan Peta';
        if (!map && userLat && userLng) {
          map = L.map('mapContainer').setView([userLat, userLng], 13);

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
          }).addTo(map);

          // User Marker
          L.marker([userLat, userLng]).addTo(map)
            .bindPopup('Posisi Anda')
            .openPopup();

          // Polyline to Kaaba
          const qiblaLine = L.polyline([
            [userLat, userLng],
            [KAABA_LAT, KAABA_LNG]
          ], { color: '#D4AF37', weight: 3, dashArray: '6, 8' }).addTo(map);

          map.fitBounds(qiblaLine.getBounds(), { padding: [20, 20] });
        }
      } else {
        mapContainer.style.display = 'none';
        toggleMapBtn.innerHTML = '<i class="fa-solid fa-map-location-dot"></i> Lihat di Peta (Alternatif)';
      }
    });

    // Start Event
    startBtn.addEventListener('click', () => {
      fetchLocation();
    });
  </script>
</body>
</html>
